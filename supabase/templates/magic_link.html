<!--
  Quiniela — passwordless sign-in email.

  signInWithOtp + verifyOtp({ type: 'email' }) is a 6-digit OTP flow. Supabase
  shares the OTP implementation with Magic Links, so to deliver a CODE (not a
  clickable link) this template surfaces {{ .Token }} — the 6-digit one-time
  password. We deliberately omit the {{ .ConfirmationURL }} magic link because
  the native app verifies the typed code, not a deep link (detectSessionInUrl
  is false on the client).

  Bilingual (ES first — the family default; EN below) so either reader has it.
-->
<h2>Quiniela</h2>

<p><strong>Tu código de acceso:</strong></p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 6px;">{{ .Token }}</p>
<p>Escribe este código de 6 dígitos en la app para entrar. Caduca en 1 hora.</p>

<hr />

<p><strong>Your login code:</strong></p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 6px;">{{ .Token }}</p>
<p>Enter this 6-digit code in the app to sign in. It expires in 1 hour.</p>
